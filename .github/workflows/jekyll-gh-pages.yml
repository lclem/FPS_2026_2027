# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy website to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        # uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.0' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 28 # Increment this number if you need to re-download cached gems

      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-science texlive-xetex latexmk texlive-binaries texlive-bibtex-extra
          version: 1.2

      - run: sudo updmap-sys

      - name: Build tutorials
        run: cd tutorials && make

      - run: mkdir -p _site/ && cp -R tutorials _site/

      - name: Jekyll version
        run: bundle exec jekyll -v

      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Show directory
        run: find _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
